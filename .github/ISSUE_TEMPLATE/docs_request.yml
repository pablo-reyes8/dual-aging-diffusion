name: Documentation request
description: Request a README, docs, notebook, or config explanation improvement.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: gap
    attributes:
      label: Documentation Gap
      description: What is unclear, missing, stale, or misleading?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Current Location
      placeholder: "README.md, docs/training.md, notebooks/train_model.ipynb, etc."
  - type: textarea
    id: desired
    attributes:
      label: Desired Update
      description: What should the docs explain or show?

