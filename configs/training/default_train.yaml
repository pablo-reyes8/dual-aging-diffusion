# High-level training configuration for scripts/train_cli.py.
# Values are intentionally explicit so experiment runs can be audited.

run:
  name: face_aging_global_local
  checkpoint_root: training_checkpoints

device:
  device: auto
  amp_enabled: true
  amp_dtype: bf16

data:
  batch_size: 4
  num_workers: 0
  pin_memory: false
  # Excludes exact local anatomical zones everywhere local crops are built.
  # Example: [labio_superior] excludes only labio_superior.
  skip_regions: []
  fused_batch_size: 1
  fused_max_crops_per_image:

models:
  global_model_id: SG161222/Realistic_Vision_V6.0_B1_noVAE
  global_vae_id: stabilityai/sd-vae-ft-mse
  local_model_id: runwayml/stable-diffusion-v1-5
  local_vae_id:
  torch_dtype: auto

adapters:
  global:
    adapter_type: lora
    rank: 8
    alpha: 8
    dropout: 0.05
    target_suffixes: [to_q, to_k, to_v, to_out.0]
  local:
    adapter_type: dora
    rank: 16
    alpha: 16
    dropout: 0.05
    target_suffixes: [to_q, to_k, to_v, to_out.0]
  optimizer:
    # Shared fallback for old calls. Branch overrides below are recommended.
    lr: 0.00007
    betas: [0.9, 0.999]
    weight_decay: 0.01
  global_optimizer:
    lr: 0.00005
  local_optimizer:
    lr: 0.00007

score_net:
  checkpoint_path: models/score net/score_net_best_overall.pt
  base_channels: 32
  dropout: 0.15
  strict: true
  freeze: true

losses:
  local:
    lambda_full: 1.0
    lambda_zone: 0.25
    lambda_score: 0.05
    lambda_cycle: 0.0
    score_timestep_min: 5
    score_timestep_max: 150
    score_loss_mode: 1_step_per_loss
    use_min_snr: true
    min_snr_gamma: 5.0
  global:
    use_aux_bundle: true
    aux:
      use_age: true
      age_model_id: nateraw/vit-age-classifier
      age_image_size: 224
      use_identity: true
      identity_pretrained: vggface2
      identity_image_size: 160
      use_lpips: false
    lambda_diff: 1.0
    lambda_id: 0.35
    lambda_age: 0.10
    lambda_delta_age: 0.15
    lambda_perc: 0.0
    semantic_timestep_min: 5
    semantic_timestep_max: 120
    semantic_loss_mode: 1_step_per_loss
    semantic_anchor_to_source: true
    delta_age_target_mode: chronological_gap
    use_min_snr: true
    min_snr_gamma: 5.0

training:
  num_epochs: 5
  local_num_epochs: 5
  global_num_epochs: 2
  train_order: [local, global]
  train_local: true
  train_global: true
  local_grad_accum_steps: 4
  global_grad_accum_steps: 4
  local_grad_clip: 1.0
  global_grad_clip: 1.0
  local_p_full: 0.50
  local_p_score: 0.35
  local_p_zone: 0.15
  local_enable_full: true
  local_enable_score: true
  local_enable_zone: true
  local_p_neutral: 0.10
  local_p_double_full: 0.15
  use_fused_loss: false
  fused_loss_epoch: 15
  fused_loss_every_n_steps: 1
  lambda_fuse_score: 0.03
  lambda_fuse_seam: 0.01
  global_p_diff: 0.70
  global_p_semantic: 0.30
  global_enable_diff: true
  global_enable_semantic: true
  global_semantic_components: [age, delta_age, id]
  global_p_neutral: 0.05
  global_p_double_diff: 0.05
  min_target_age: 18
  max_target_age: 85
  build_schedulers_if_missing: true
  local_warmup_ratio: 0.05
  global_warmup_ratio: 0.05
  local_min_lr: 0.000001
  global_min_lr: 0.000001
  min_warmup_steps: 10
  max_warmup_steps:
  save_latest: true
  save_best: true
  save_epoch_checkpoints: true
  save_inference_copy: true
  local_monitor_key: loss/total
  global_monitor_key: loss/total
  enable_gradient_checkpointing_flag: true
  offload_after_each_branch: true
  print_memory: true
  local_max_batches:
  global_max_batches:
  inner_print_every: 10
  inner_verbose: false
  print_first_batch: false
  verbose: true

# Optional real longitudinal supervision. With enabled=false the old pipeline
# does not load or execute anything from FG-NET/AgeDB.
paired_supervision:
  enabled: false
  root:
  dataset: auto               # auto | fgnet | agedb
  batch_size: 2
  every_n_steps: 4            # one separate GT backward every 4 regular batches
  weight: 0.25
  min_age_gap: 5
  max_age_gap: 40
  max_pairs_per_identity: 8
  min_image_side: 128         # AgeDB contains many very small thumbnails
  val_fraction: 0.15          # split is identity-disjoint

sampling:
  enabled: false
  sample_every_epochs: 0
  sampling_output_dir:
  sample_global_strength: 0.25
  sample_global_guidance_scale: 3.5
  sample_global_num_inference_steps: 40
  sample_global_negative_prompt:
  sample_local_strength: 0.20
  sample_local_guidance_scale: 0.8
  sample_local_num_inference_steps: 40
  sample_local_negative_prompt:
  # 1 keeps the current single local img2img pass. Use 2 for local recycling before fusion.
  sample_local_recycle_passes: 1
  sample_local_recycle_strength:
  sample_local_recycle_guidance_scale:
  sample_local_recycle_num_inference_steps:
  sample_residual_alpha: 0.35
  sample_residual_sigma: 9.0
  sample_use_face_mask: true
  sample_face_mask_blur_sigma: 3.0
  sample_local_insert_alpha: 1.0
  sample_local_mask_blur_sigma: 5.0
  sample_color_match: true
  sample_color_match_strength: 0.75
  sample_seed: 123
  sample_save_grid: true
