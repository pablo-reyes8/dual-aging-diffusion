# Dataset longitudinal recomendado para la primera prueba.
dataset: fgnet
root: null                    # ruta manual opcional; null usa el cache
cache_dir: data/external/paired_aging
download_if_missing: true     # descarga Kaggle solo si el cache no está completo

resolution: 512
batch_size: 2
num_workers: 2
pin_memory: true
seed: 42

# Pares de la misma identidad: siempre source_age < target_age.
min_age_gap: 5
max_age_gap: 40
max_pairs_per_identity: 8
min_image_side: 128
val_fraction: 0.15            # split por identidad, no por imagen

every_n_steps: 4
weight: 0.25
loss:
  lambda_target_diff: 1.0
  lambda_source_diff: 0.25
  lambda_latent_delta: 0.0    # mantener OFF: las fotos no están alineadas
  use_min_snr: true
  min_snr_gamma: 5.0
