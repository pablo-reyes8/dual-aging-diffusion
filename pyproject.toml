[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-aging"
version = "0.1.0"
description = "Dual-scale face aging experiments with global and local diffusion branches."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Alejo" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "matplotlib>=3.7",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
diffusion = [
  "accelerate>=0.28",
  "diffusers>=0.27",
  "safetensors>=0.4",
  "transformers>=4.40",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["src*", "data*"]
exclude = ["tests*", "planning*", "notebooks*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "slow: tests that are intentionally not run in the default CI path",
  "requires_models: tests that require downloaded model weights",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "notebooks",
  "planning",
  "data/data_subset",
  "data/results_labeling",
  "data/ffhq_predictions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F403", "F405"]
